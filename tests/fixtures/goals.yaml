# TurtleBot3 World Navigation Goals (Phase P2 Ground Truth - Verified vs Map & Launch)
start_pose:
  x: -2.0
  y: -0.5
  z: 0.01
  orientation:
    x: 0.0
    y: 0.0
    z: 0.0
    w: 1.0

goals:
  - id: goal_1
    description: "Verified safe free goal 1 (near corridor)"
    pose:
      position: {x: -0.95, y: -0.50, z: 0.0}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
  - id: goal_2
    description: "Verified safe free goal 2 (center open space)"
    pose:
      position: {x: 0.75, y: 0.0, z: 0.0}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
  - id: goal_3
    description: "Verified safe free goal 3 (right area)"
    pose:
      position: {x: 1.05, y: 0.0, z: 0.0}
      orientation: {x: 0.0, y: 0.0, z: 0.707, w: 0.707}
  - id: goal_4
    description: "Verified safe free goal 4 (upper area)"
    pose:
      position: {x: 0.05, y: 1.30, z: 0.0}
      orientation: {x: 0.0, y: 0.0, z: 1.0, w: 0.0}
  - id: goal_5
    description: "Verified safe free goal 5 (lower area)"
    pose:
      position: {x: 0.75, y: -1.0, z: 0.0}
      orientation: {x: 0.0, y: 0.0, z: -0.707, w: 0.707}

obstacle_goal:
  id: obstacle_goal_invalid
  description: "Goal placed inside a wall/obstacle to test recovery and planner failure handling"
  pose:
    position: {x: -1.05, y: 2.80, z: 0.0}
    orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}

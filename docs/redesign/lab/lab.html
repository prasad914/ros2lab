<div class="lab" id="lab">
  <div class="desk" id="desk" aria-label="Practice computer: Ubuntu 24.04 desktop with Terminator and turtlesim">
    <div class="gbar"><span class="act">Activities</span><span id="clock"></span><span class="sys" aria-hidden="true"><svg width="15" height="12" viewBox="0 0 15 12"><path d="M7.5 11.5L0.6 3.6a10 10 0 0 1 13.8 0z" fill="#fff"/></svg><svg width="14" height="12" viewBox="0 0 14 12"><path d="M1 4h3l4-3v10L4 8H1z" fill="#fff"/><path d="M10 3.5a4 4 0 0 1 0 5M11.8 1.8a6.5 6.5 0 0 1 0 8.4" stroke="#fff" stroke-width="1.3" fill="none"/></svg><svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 1v4.5" stroke="#fff" stroke-width="1.5"/><path d="M3.2 2.8a4.5 4.5 0 1 0 5.6 0" stroke="#fff" stroke-width="1.5" fill="none"/></svg></span></div>
    <button class="reopen" id="reopen" type="button" hidden><svg width="38" height="38" viewBox="0 0 38 38" aria-hidden="true"><rect x="2" y="5" width="34" height="28" rx="5" fill="#2B2B2B" stroke="#555"/><rect x="2" y="5" width="34" height="6" rx="3" fill="#C80003"/><path d="M8 18l5 4-5 4M15 27h8" stroke="#AAAAAA" stroke-width="2" fill="none"/></svg><span>Terminator</span></button>

    <section class="win" id="w-term" aria-label="Terminator">
      <div class="wt"><span class="wtitle" id="termTitle">student@ros2lab: ~</span><span class="wbs"><button class="wb" data-w="min" type="button" aria-label="Minimise"><svg viewBox="0 0 10 10"><path d="M2 7.5h6" stroke="currentColor" stroke-width="1.4"/></svg></button><button class="wb" data-w="max" type="button" aria-label="Maximise"><svg viewBox="0 0 10 10"><rect x="2" y="2" width="6" height="6" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button><button class="wb wx" data-w="close" type="button" aria-label="Close"><svg viewBox="0 0 10 10"><path d="M2.5 2.5l5 5M7.5 2.5l-5 5" stroke="currentColor" stroke-width="1.4"/></svg></button></span></div>
      <div class="tabs" id="tabs" hidden></div>
      <div class="tbody" id="tbody"></div>
    </section>

    <section class="win" id="w-sim" hidden aria-label="TurtleSim window">
      <div class="wt"><span class="wtitle">TurtleSim</span><span class="wbs"><button class="wb" data-w="min" type="button" aria-label="Minimise"><svg viewBox="0 0 10 10"><path d="M2 7.5h6" stroke="currentColor" stroke-width="1.4"/></svg></button><button class="wb" data-w="max" type="button" aria-label="Maximise"><svg viewBox="0 0 10 10"><rect x="2" y="2" width="6" height="6" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button><button class="wb wx" data-w="close" type="button" aria-label="Close"><svg viewBox="0 0 10 10"><path d="M2.5 2.5l5 5M7.5 2.5l-5 5" stroke="currentColor" stroke-width="1.4"/></svg></button></span></div>
      <div class="simc"><canvas id="cv-path" width="500" height="500"></canvas><canvas id="cv-spr" width="500" height="500" role="img" aria-label="Turtlesim: the turtle and the lines it has drawn"></canvas></div>
    </section>

    <section class="win" id="w-rqt" hidden aria-label="rqt_graph window">
      <div class="wt"><span class="wtitle">rqt_graph__RosGraph - rqt</span><span class="wbs"><button class="wb wx" data-w="close" type="button" aria-label="Close"><svg viewBox="0 0 10 10"><path d="M2.5 2.5l5 5M7.5 2.5l-5 5" stroke="currentColor" stroke-width="1.4"/></svg></button></span></div>
      <div class="rqtbar"><span>Nodes/Topics (active)</span><span>/</span><label><input type="checkbox" checked disabled> Hide: Debug</label><button type="button" id="rqt-refresh" aria-label="Refresh graph">⟳</button></div>
      <div class="rqtc"><svg id="rqt-svg" viewBox="0 0 520 200" role="img" aria-label="Graph of running nodes and topics"></svg></div>
    </section>

    <div class="ctx" id="ctx" hidden role="menu">
      <button data-act="copy" type="button">Copy<kbd>Shift+Ctrl+C</kbd></button>
      <button data-act="paste" type="button">Paste<kbd>Shift+Ctrl+V</kbd></button>
      <hr>
      <button data-act="sh" type="button">Split Horizontally<kbd>Shift+Ctrl+O</kbd></button>
      <button data-act="sv" type="button">Split Vertically<kbd>Shift+Ctrl+E</kbd></button>
      <button data-act="tab" type="button">Open Tab<kbd>Shift+Ctrl+T</kbd></button>
      <hr>
      <button data-act="clear" type="button">Clear screen<kbd>Ctrl+L</kbd></button>
      <button data-act="close" type="button">Close<kbd>Shift+Ctrl+W</kbd></button>
    </div>
  </div>

  <div class="labbar">
    <div class="lb-row">
      <div class="gtabs" id="gtabs" role="tablist" aria-label="Command groups"></div>
      <div class="lb-tools">
        <button type="button" id="demo-btn" class="lbtn main">Play demo</button>
        <button type="button" id="split-h" class="lbtn" title="Split horizontally (Shift+Ctrl+O)">Split ⬓</button>
        <button type="button" id="split-v" class="lbtn" title="Split vertically (Shift+Ctrl+E)">Split ◫</button>
        <button type="button" id="reset-btn" class="lbtn">Reset</button>
      </div>
    </div>
    <div class="lb-row">
      <div class="chips" id="chips"></div>
      <div class="pad" id="pad" hidden aria-label="Teleop keys"><span>Teleop</span><button type="button" data-k="ArrowLeft" aria-label="Turn left">←</button><button type="button" data-k="ArrowUp" aria-label="Forward">↑</button><button type="button" data-k="ArrowDown" aria-label="Backward">↓</button><button type="button" data-k="ArrowRight" aria-label="Turn right">→</button></div>
    </div>
  </div>
</div>

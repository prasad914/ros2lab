<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificate | ROS2Lab</title>
<meta name="description" content="Check that a ROS2Lab certificate is genuine and still valid.">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/certificate.css">
<style>
  :root { --ink: #1D2B53; --paper: #EEF4FB; --ok: #1E8E3E; --err: #B3261E; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Atkinson Hyperlegible", system-ui, sans-serif; }
  .bar { max-width: 1120px; margin: 0 auto; padding: 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .brand { font-family: Lexend, sans-serif; font-weight: 700; color: var(--ink); text-decoration: none; }
  .btn { display: inline-block; font: inherit; font-weight: 700; padding: 10px 18px; border-radius: 8px; border: 2px solid var(--ink); background: var(--ink); color: #fff; text-decoration: none; cursor: pointer; }
  .btn.white { background: #fff; color: var(--ink); }
  .btn:focus-visible { outline: 3px solid #FFC83D; outline-offset: 2px; }
  .status { max-width: 1120px; margin: 0 auto 14px; padding: 12px 16px; border-radius: 8px; background: #fff; border-left: 6px solid var(--ok); }
  .status.err { border-left-color: var(--err); }
  .wrapc { max-width: 1120px; margin: 0 auto; padding: 0 16px 30px; }
  .hint { text-align: center; color: #4A5779; font-size: .9rem; padding: 0 16px 30px; }
  .lookup { max-width: 560px; margin: 30px 16px; background: #fff; padding: 22px; border-radius: 12px; }
  @media (min-width: 600px) { .lookup { margin: 30px auto; } }
  .lookup input { width: 100%; font: inherit; padding: 10px; border: 2px solid #C9D5E8; border-radius: 8px; margin: 8px 0 12px; text-transform: uppercase; }
  @media print {
    body { background: #fff; }
    html, body { width: 297mm; height: 210mm; overflow: hidden; }
    .bar, .status, .lookup, .hint { display: none !important; }
    .wrapc { padding: 0; max-width: none; }
  }
</style>
</head>
<body>
<div class="bar"><a class="brand" href="index.html" style="display:flex;align-items:center;gap:10px"><img src="img/logo-axes.svg" alt="" width="36" height="36">ROS2Lab</a><div id="actions" style="display:flex;gap:8px;flex-wrap:wrap"></div></div>
<main id="main"><p style="text-align:center;margin-top:40px">Loading…</p></main>
<script type="module" src="js/certificate.js"></script>
</body>
</html>

source: parameters robot_description_semantic / robot_description of /move_group
robot: gen3
groups:
  manipulator:
    joints: []
    chains:
    - base: base_link
      tip: end_effector_link
    links: []
    subgroups: []
  gripper:
    joints:
    - robotiq_85_base_joint
    - robotiq_85_left_inner_knuckle_joint
    - robotiq_85_left_knuckle_joint
    - robotiq_85_left_finger_joint

    joint_1: 0.0
    joint_2: 0.26
    joint_3: 3.14
    joint_4: -2.27
    joint_5: 0.0
    joint_6: 0.96
    joint_7: 1.57
- name: Retract
  group: manipulator
  joints:
    joint_1: 0.0
    joint_2: -0.35
    joint_3: 3.14
    joint_4: -2.54
    joint_5: 0.0
    joint_6: -0.87
    joint_7: 1.57
- name: Vertical
  group: manipulator
  joints:
    joint_1: 0.0
    joint_2: 0.0
    joint_3: 0.0
    joint_4: 0.0
    joint_5: 0.0
    joint_6: 0.0
    joint_7: 0.0
end_effectors:
- name: gripper
  parent_link: end_effector_link

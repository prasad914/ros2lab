/smoother_server:
  ros__parameters:
    /bond_disable_heartbeat_timeout: true
    action_server_result_timeout: 10.0
    autostart_node: false
    bond_heartbeat_period: 0.1
    costmap_topic: global_costmap/costmap_raw
    footprint_topic: global_costmap/published_footprint
    qos_overrides:
      /clock:
        subscription:
          depth: 1
          durability: volatile
          history: keep_last
          reliability: best_effort
      /tf:
        subscription:
          depth: 100
          durability: volatile
          history: keep_last
          reliability: reliable
      /tf_static:
        subscription:
          depth: 100
          history: keep_last
          reliability: reliable
    robot_base_frame: base_link
    simple_smoother:
      do_refinement: true
      max_its: 1000
      plugin: nav2_smoother::SimpleSmoother
      refinement_num: 2
      tolerance: 1.0e-10
      w_data: 0.2
      w_smooth: 0.3
    smoother_plugins:
    - simple_smoother
    start_type_description_service: true
    transform_tolerance: 0.1
    use_sim_time: true


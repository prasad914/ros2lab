# ros2 param dump --no-daemon /controller_server
/controller_server:
  ros__parameters:
    ? ''
    : position_checker:
        stateful: true
        xy_goal_tolerance: 0.25
    /bond_disable_heartbeat_timeout: true
    FollowPath:
      allow_reversing: false
      angular_disengage_threshold: 0.3925
      angular_dist_threshold: 0.785
      approach_velocity_scaling_dist: 0.6
      cancel_deceleration: 3.2
      closed_loop: true
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      curvature_lookahead_dist: 0.6
      desired_linear_vel: 0.5
      forward_sampling_distance: 0.5
      inflation_cost_scaling_factor: 3.0
      interpolate_curvature_after_goal: false
      lookahead_dist: 0.6
      lookahead_time: 1.5
      max_allowed_time_to_collision_up_to_carrot: 1.0
      max_angular_accel: 3.2
      max_cost_threshold: 254.0
      max_lookahead_dist: 0.9
      max_robot_pose_search_dist: 1.4875
      min_approach_linear_velocity: 0.05
      min_lookahead_dist: 0.3
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      rotate_to_goal_heading: false
      rotate_to_heading_angular_vel: 1.8
      rotate_to_heading_min_angle: 0.785
      rotate_to_heading_once: false
      simulate_ahead_time: 1.0
      stateful: true
      transform_tolerance: 0.1
      use_cancel_deceleration: false
      use_collision_detection: true
      use_cost_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      use_path_orientations: false
      use_regulated_linear_velocity_scaling: true
      use_rotate_to_heading: true
      use_velocity_scaled_lookahead_dist: false
    action_server_result_timeout: 10.0
    autostart_node: false
    bond_heartbeat_period: 0.1
    controller_frequency: 20.0
    controller_plugins:
    - FollowPath
    costmap_update_timeout: 0.3
    enable_stamped_cmd_vel: false
    failure_tolerance: 0.3
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      symmetric_yaw_tolerance: false
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    goal_checker_plugins:
    - general_goal_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    odom_topic: odom
    progress_checker:
      movement_time_allowance: 10.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
    progress_checker_plugins:
    - progress_checker
    publish_zero_velocity: true
    qos_overrides:
      /clock:
        subscription:
          depth: 1
          durability: volatile
          history: keep_last
          reliability: best_effort
    speed_limit_topic: speed_limit
    start_type_description_service: true
    use_realtime_priority: false
    use_sim_time: true


launch:
- arg:
    name: goal_x
    default: "8.0"
- arg:
    name: goal_y
    default: "8.0"
- node:
    pkg: turtlesim
    exec: turtlesim_node
    name: sim
- node:
    pkg: chiku_control
    exec: go_to_goal
    name: go_to_goal
    output: screen
    param:
    - name: goal_x
      value: $(var goal_x)
    - name: goal_y
      value: $(var goal_y)
